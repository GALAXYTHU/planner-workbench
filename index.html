<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>何老师工作台 · 个人办公</title>
<style>
/* ==================== Reset & Base ==================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#2B2622;--ink-2:#57504A;--ink-3:#8C847C;
  --red:#8B1A1A;--red-l:#B33A3A;--red-bg:#FBF1EF;--red-border:#EDD0C8;
  --amber:#A6720A;--amber-bg:#FBF5E8;--amber-border:#EBDDBE;
  --blue:#46677F;--blue-bg:#EFF4F7;--blue-border:#CBD9E2;
  --green:#2F6B45;--green-bg:#EFF6F0;
  --bg:#F6F4F0;--card:#FFFDFB;--border:#E7E2DA;--border-l:#F0EBE3;
  --text:#2B2622;--text-2:#6E675F;--text-3:#A39A90;
  --radius:10px;--radius-lg:16px;
  --shadow:0 1px 2px rgba(43,38,34,.04),0 2px 8px rgba(43,38,34,.04);
  --shadow-lg:0 4px 20px rgba(43,38,34,.08);
  --sidebar-w:212px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Songti SC","STSong",serif;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#D5CFC7;border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ==================== Header ==================== */
.app-header{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.header-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:12px;flex-wrap:wrap}
.logo-area{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#8B1A1A,#5C2828);display:flex;align-items:center;justify-content:center;color:#F5EBDD;flex-shrink:0}
.logo-mark svg{width:18px;height:18px}
.logo-area h1{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:.5px}
.logo-area .subtitle{font-size:11px;color:var(--text-3);margin-left:2px}
.header-actions{display:flex;gap:8px;align-items:center}

/* ==================== Buttons ==================== */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;transition:all .15s;white-space:nowrap;min-height:38px}
.btn svg{width:16px;height:16px;flex-shrink:0}
.btn-outline{border:1px solid var(--border);background:var(--card);color:var(--text-2)}
.btn-outline:hover{border-color:var(--ink-3);color:var(--text)}
.btn-danger{border:1px solid var(--red-border);background:var(--red-bg);color:var(--red)}
.btn-danger:hover{background:#F6E3DE}
.btn-primary{background:var(--ink);color:#FBF8F3}
.btn-primary:hover{background:#443D37}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:#701414}
.btn-sm{padding:5px 10px;font-size:12px;min-height:30px;border-radius:7px}
.btn-block{width:100%;justify-content:center;min-height:44px}
.btn-ghost{color:var(--text-3);padding:4px 8px;min-height:auto;font-size:13px}
.btn-ghost:hover{color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ==================== Calendar Widget ==================== */
.cal-widget{background:linear-gradient(135deg,rgba(58,40,40,.78) 0%,rgba(90,56,56,.72) 50%,rgba(139,26,26,.66) 100%);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 10px;color:#fff;position:relative;overflow:hidden;border-radius:0 0 12px 12px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.cal-title{font-size:12px;font-weight:700;color:#fff;letter-spacing:.5px;display:flex;align-items:center;gap:5px}
.cal-title .cal-month{font-size:13px}
.cal-nav{display:flex;gap:4px}
.cal-nav button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);color:#fff;width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-size:12px}
.cal-nav button:hover{background:rgba(255,255,255,.25)}
.cal-nav .cal-today-btn{width:auto;padding:0 6px;font-size:10px;white-space:nowrap}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-weekday{text-align:center;font-size:9px;color:rgba(255,255,255,.5);font-weight:600;padding:1px 0}
.cal-weekday.wk-sat{color:rgba(255,180,100,.7)}
.cal-weekday.wk-sun{color:rgba(255,120,120,.7)}
.cal-cell{min-height:28px;background:rgba(255,255,255,.06);border-radius:3px;padding:2px 3px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;transition:all .15s;cursor:default}
.cal-cell.empty{background:transparent;cursor:default}
.cal-cell.today{background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 2px #ff6b6b}
.cal-cell.all-done{background:rgba(45,125,74,.25)}
.cal-cell.all-done.today{box-shadow:inset 0 0 0 2px #ff6b6b}
.cal-date{font-size:11px;font-weight:600;color:#fff;line-height:1.2}
.cal-date.wk-sat{color:rgba(255,200,140,.9)}
.cal-date.wk-sun{color:rgba(255,150,150,.9)}
.cal-cell.empty .cal-date{opacity:0}
.cal-todo-badge{position:absolute;top:0;right:1px;font-size:6px;background:var(--red-l);color:#fff;border-radius:4px;padding:0 2px;min-width:12px;text-align:center;line-height:10px;font-weight:600}
.cal-cell.all-done .cal-todo-badge{background:#2D7D4A}
.cal-cell.no-todo .cal-todo-badge{display:none}
.cal-summary{display:flex;justify-content:center;gap:10px;margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,.1);font-size:10px;color:rgba(255,255,255,.6)}
.cal-summary span{display:flex;align-items:center;gap:3px}
.cal-summary .cal-s-dot{width:7px;height:7px;border-radius:2px;display:inline-block}
.cal-summary .cal-s-dot.done{background:#5cba6d}
.cal-summary .cal-s-dot.undone{background:#ff6b6b}
.cal-summary .cal-s-dot.total{background:rgba(255,255,255,.3)}
.cal-body{overflow:hidden;transition:max-height .3s ease,opacity .3s ease;max-height:500px;opacity:1}
.cal-body.collapsed{max-height:0;opacity:0;margin:0;padding:0}
.cal-toggle{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);color:#fff;width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.cal-toggle svg{transition:transform .3s ease;width:12px;height:12px}
.cal-toggle.collapsed svg{transform:rotate(180deg)}

/* ==================== Error & Cache Banners ==================== */
.error-banner{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--red-bg);border-bottom:1px solid var(--red-border);color:var(--red);font-size:13px}
.error-banner svg{width:16px;height:16px;flex-shrink:0}
.error-banner .eb-text{flex:1}
.error-banner .btn{flex-shrink:0}
.cache-banner{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--amber-bg);border-bottom:1px solid var(--amber-border);color:var(--amber);font-size:12px}

/* ==================== Main Layout ==================== */
.main-layout{display:flex;min-height:calc(100vh - 50px)}
.sidebar{width:var(--sidebar-w);background:#26211D;flex-shrink:0;padding:16px 0;position:sticky;top:50px;height:calc(100vh - 50px);overflow-y:auto;display:flex;flex-direction:column}
.sidebar .nav-section{padding:0 12px}
.sidebar .nav-label{font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1.5px;padding:10px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;color:rgba(255,255,255,.5);font-size:14px;border-radius:var(--radius);width:100%;text-align:left;transition:all .15s;min-height:42px;margin-bottom:2px;position:relative}
.nav-item svg{width:19px;height:19px;flex-shrink:0}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav-item.active{color:#F5EBDD;background:rgba(255,255,255,.08)}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--red-l)}
.nav-count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.1);padding:1px 7px;border-radius:9px;min-width:22px;text-align:center}
.sidebar-footer{margin-top:auto;padding:16px 20px;font-size:11px;color:rgba(255,255,255,.3);line-height:1.6}
.content{flex:1;padding:20px 24px 90px;max-width:980px;width:100%}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:4px 2px calc(4px + var(--safe-b));z-index:50}
.mobile-nav .nav-item{flex:1;flex-direction:column;gap:2px;padding:6px 2px;font-size:10px;color:var(--text-3);min-height:auto;align-items:center;border-radius:8px}
.mobile-nav .nav-item svg{width:20px;height:20px}
.mobile-nav .nav-item.active{color:var(--red);background:none}
.mobile-nav .nav-item.active::before{display:none}
.tab-content{display:none;animation:fadeIn .25s ease}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tab-title{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.tab-title svg{width:22px;height:22px;color:var(--red)}
.tab-sub{font-size:12px;color:var(--text-3);margin:-10px 0 14px}

/* ==================== Cards & Forms ==================== */
.todo-form,.notes-form,.project-form{background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow);margin-bottom:14px}
.form-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.form-row+.form-row{margin-top:8px}
.form-group{display:flex;align-items:center}
.input-flex{flex:1;min-width:0}
.input,.select{padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius);background:#FFF;color:var(--text);transition:border-color .15s;width:100%}
.input:focus,.select:focus{outline:none;border-color:var(--ink-3)}
textarea.input{resize:vertical;line-height:1.5}
.select{width:auto;min-width:110px}
.group-toggle{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:3px;margin-bottom:14px}
.group-toggle button{padding:6px 14px;font-size:12px;color:var(--text-3);border-radius:7px;transition:all .15s}
.group-toggle button.active{background:var(--ink);color:#FBF8F3}
.project-hint{font-size:12px;color:var(--blue);background:var(--blue-bg);border-radius:7px;padding:6px 10px;margin-top:8px}

/* ==================== Skeleton ==================== */
.sk-row{height:56px;border-radius:12px;background:linear-gradient(90deg,var(--border-l) 25%,#F8F5F0 50%,var(--border-l) 75%);background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
.sk-row.short{height:38px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ==================== Overview ==================== */
.ov-greet{margin-bottom:18px}
.ov-greet .greet-hi{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--ink);letter-spacing:.5px}
.ov-greet .greet-date{font-size:13px;color:var(--text-3);margin-top:2px}
.ov-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.ov-stat{background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow)}
.ov-stat .ov-num{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--ink);line-height:1.1}
.ov-stat .ov-num small{font-size:15px;color:var(--text-3);font-family:var(--font);font-weight:400}
.ov-stat .ov-label{font-size:12px;color:var(--text-3);margin-top:4px}
.ov-section-title{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:1px;margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.ov-section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.today-zone{background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.tz-item{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border-l);transition:background .12s}
.tz-item:last-child{border-bottom:none}
.tz-item:hover{background:#FBF9F5}
.tz-item.overdue{background:var(--red-bg)}
.tz-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;color:transparent}
.tz-check:hover{border-color:var(--green);color:var(--green)}
.tz-check svg{width:13px;height:13px}
.tz-title{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tz-tag{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700;flex-shrink:0}
.tz-tag.P0{background:var(--red);color:#fff}
.tz-tag.P1{background:var(--amber);color:#fff}
.tz-tag.P2{background:var(--blue);color:#fff}
.tz-date{font-size:11px;color:var(--text-3);flex-shrink:0}
.tz-date.late{color:var(--red);font-weight:600}
.tz-empty{padding:22px;text-align:center;color:var(--green);font-size:13px}
.goals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.goal-card{background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius-lg);padding:14px;box-shadow:var(--shadow);text-align:center;position:relative}
.goal-card .goal-del{position:absolute;top:6px;right:8px;color:var(--text-3);font-size:16px;line-height:1;padding:2px 4px}
.goal-card .goal-del:hover{color:var(--red)}
.goal-ring{width:84px;height:84px;margin:0 auto 8px}
.goal-ring .ring-bg{stroke:var(--border-l)}
.goal-ring .ring-fg{stroke:var(--red);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.goal-ring text{font-family:var(--serif);font-size:19px;font-weight:700;fill:var(--ink)}
.goal-name{font-size:12px;color:var(--text-2);line-height:1.4}
.goal-num{font-size:11px;color:var(--text-3);margin-top:2px}
.goal-add{background:var(--card);border:1.5px dashed var(--border);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.goal-add .input,.goal-add .select{font-size:12px;padding:7px 9px}
.week-chart{background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow)}
.week-chart svg{display:block;width:100%;height:auto}
.wc-bar{fill:var(--red-l);rx:4}
.wc-bar.dim{fill:var(--border)}
.wc-label{font-size:9px;fill:var(--text-3)}
.wc-val{font-size:9px;fill:var(--ink-2);font-weight:600}

/* ==================== Todo Items ==================== */
.todo-group{margin-bottom:18px}
.todo-group-header{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.5px;margin-bottom:8px;padding:0 2px}
.todo-group-header .gh-count{font-weight:400;color:var(--text-3)}
.todo-item{display:flex;flex-wrap:wrap;align-items:flex-start;column-gap:10px;background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius);margin-bottom:8px;padding:11px 14px;box-shadow:var(--shadow);transition:box-shadow .15s}
.todo-item:hover{box-shadow:var(--shadow-lg)}
.todo-item.done{opacity:.55}
.todo-item.pending-op{border-style:dashed}
.todo-main{display:flex;align-items:flex-start;gap:10px;padding:11px 14px}
.todo-check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;transition:all .15s;color:transparent;cursor:pointer}
.todo-check:hover{border-color:var(--green);color:var(--green)}
.todo-check.checked{background:var(--green);border-color:var(--green);color:#fff}
.todo-check svg{width:12px;height:12px}
.todo-body{flex:1;min-width:0}
.todo-title{font-size:14px;font-weight:500;line-height:1.4}
.todo-item.done .todo-title{text-decoration:line-through;color:var(--text-3)}
.todo-meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap;font-size:11px;color:var(--text-3)}
.badge{font-size:10px;padding:1px 6px;border-radius:5px;font-weight:700}
.badge.P0{background:var(--red-bg);color:var(--red)}
.badge.P1{background:var(--amber-bg);color:var(--amber)}
.badge.P2{background:var(--blue-bg);color:var(--blue)}
.todo-meta .m-date.late{color:var(--red);font-weight:600}
.todo-meta .m-postpone{color:var(--red)}
.todo-remark{font-size:12px;color:var(--text-2);background:var(--bg);border-radius:7px;padding:6px 9px;margin-top:6px;white-space:pre-wrap}
.todo-actions{display:flex;gap:2px;flex-shrink:0}
.todo-edit-form{padding:0 14px 12px;display:none}
.todo-item.editing .todo-edit-form{display:block}
.todo-item.editing .todo-main{display:none}
.todo-item.editing .subtasks{display:none}
.edit-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.edit-row .input,.edit-row .select{font-size:13px;padding:7px 10px}

/* ==================== Monthly / Subtasks ==================== */
.subtasks{margin:4px 0 0 32px;border-left:2px solid var(--border-l);padding-left:12px;padding-bottom:6px}
.subtask-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border-l)}
.subtask-item:last-of-type{border-bottom:none}
.subtask-add{display:flex;gap:6px;padding:8px 0;flex-wrap:wrap;align-items:center}
.subtask-add .input,.subtask-add .select{font-size:12px;padding:6px 9px;width:auto}
.subtask-add .sa-title{flex:1;min-width:120px}
.subtask-add .sa-remark{flex:1}
.repeat-row{display:flex;gap:6px;align-items:center;width:100%;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.repeat-row input[type=checkbox]{width:15px;height:15px}
.repeat-row .input{width:auto;font-size:12px;padding:5px 8px}

/* ==================== Deadline Reminder ==================== */
.deadline-reminder{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius-lg);margin-bottom:14px;overflow:hidden}
.deadline-reminder-header{display:flex;align-items:center;gap:7px;padding:9px 14px;font-size:13px;font-weight:700;color:var(--amber)}
.deadline-reminder-header svg{width:16px;height:16px}
.deadline-reminder-body{padding:0 14px 10px}
.deadline-reminder-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--amber-border);flex-wrap:wrap}
.deadline-reminder-item:last-child{border-bottom:none}
.dr-text{flex:1;font-size:13px;min-width:0}
.dr-days{font-size:11px;font-weight:700;flex-shrink:0}
.dr-days.urgent{color:var(--red)}
.dr-days.warning{color:var(--amber)}
.dr-btn{flex-shrink:0}

/* ==================== Notes ==================== */
.tag-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag-chip{padding:5px 12px;font-size:12px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text-2);transition:all .15s}
.tag-chip.active{background:var(--ink);color:#FBF8F3;border-color:var(--ink)}
.tag-count{opacity:.6;font-size:11px}
.note-card{background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius);padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.note-content{font-size:14px;line-height:1.6;white-space:pre-wrap}
.note-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px;flex-wrap:wrap}
.note-tags{display:flex;gap:5px;flex-wrap:wrap}
.note-tag{font-size:11px;background:var(--blue-bg);color:var(--blue);padding:2px 8px;border-radius:5px}
.note-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-3)}
.delete-btn{cursor:pointer;color:var(--text-3);display:inline-flex;padding:2px}
.delete-btn:hover{color:var(--red)}
.delete-btn svg{width:15px;height:15px}

/* ==================== Projects ==================== */
.project-card{background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.project-card.blocked{border-left:3px solid var(--red)}
.project-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.project-name{font-size:15px;font-weight:700;flex:1;min-width:0}
.proj-status{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:700}
.proj-status.P0{background:var(--red);color:#fff}
.proj-status.P1{background:var(--amber);color:#fff}
.proj-status.P2{background:var(--blue);color:#fff}
.project-actions{display:flex;gap:2px}
.proj-progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:6px}
.proj-progress-label .pct{font-weight:700;color:var(--ink)}
.phase-bar-wrap{position:relative}
.phase-bar{position:relative;height:8px;background:var(--border-l);border-radius:4px;overflow:visible}
.phase-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#B33A3A,#8B1A1A);border-radius:4px;transition:width .2s}
.phase-divider{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--card)}
.phase-handle{position:absolute;top:50%;width:14px;height:14px;background:#fff;border:2px solid var(--red);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:var(--shadow)}
.phase-slider{width:100%;opacity:0;position:absolute;top:-6px;height:20px;cursor:pointer;margin:0}
.phase-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--text-3);margin-top:5px}
.phase-label.active{color:var(--red);font-weight:700}
.quality-section{margin-top:12px}
.quality-title{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.quality-checks{display:flex;gap:6px;flex-wrap:wrap}
.quality-check{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid var(--border);color:var(--text-2);cursor:pointer;transition:all .15s}
.quality-check.checked{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.qc-icon{width:14px;height:14px;display:inline-flex}
.qc-icon svg{width:14px;height:14px}
.project-field{display:flex;gap:8px;font-size:13px;margin-top:8px}
.field-label{color:var(--text-3);flex-shrink:0;font-size:12px;min-width:56px}
.field-value{flex:1}
.project-blocker{display:flex;align-items:center;gap:7px;margin-top:10px;padding:8px 10px;background:var(--red-bg);border-radius:8px;font-size:13px;color:var(--red)}
.project-blocker svg{width:15px;height:15px;flex-shrink:0}
.blocker-label{font-weight:700;flex-shrink:0}
.project-progress{margin-top:10px}
.progress-track{height:6px;background:var(--border-l);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:3px}
.progress-text{font-size:11px;color:var(--text-3);margin-top:4px}
.project-edit-form{display:none}
.project-card.editing .project-edit-form{display:block}
.project-card.editing .project-display{display:none}

/* ==================== Review ==================== */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat-card{background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow);text-align:center}
.stat-value{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--red)}
.stat-value.blue{color:var(--blue)}
.stat-value.amber{color:var(--amber)}
.stat-label{font-size:11px;color:var(--text-3);margin-top:2px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.chart-card,.suggestion-card,.reflection-card{background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow)}
.chart-card h3,.suggestion-card h3,.reflection-card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px;color:var(--ink)}
.chart-card h3 svg,.suggestion-card h3 svg,.reflection-card h3 svg{width:16px;height:16px;color:var(--red)}
.donut-wrap{display:flex;align-items:center;gap:16px}
.donut-chart{width:110px;height:110px;flex-shrink:0}
.donut-center{font-family:var(--serif);font-size:22px;font-weight:700;fill:var(--ink)}
.donut-label{font-size:9px;fill:var(--text-3)}
.donut-legend{flex:1}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);padding:3px 0}
.legend-dot{width:9px;height:9px;border-radius:3px}
.legend-value{margin-left:auto;font-weight:700}
.bar-label{font-size:10px;fill:var(--text-2)}
.bar-value{font-size:10px;fill:var(--text-3)}
.suggestion-card{margin-bottom:14px}
.suggestion-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-2);padding:5px 0}
.sug-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);margin-top:8px;flex-shrink:0}
.suggestion-empty{font-size:13px;color:var(--green)}
.blocker-list{display:flex;flex-direction:column;gap:8px}
.blocker-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text-2)}
.blocker-item svg{width:15px;height:15px;color:var(--red);flex-shrink:0;margin-top:3px}
.blocker-name{font-weight:700}
.review-list{display:flex;flex-direction:column}
.review-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--border-l);font-size:13px}
.review-item:last-child{border-bottom:none}
.ri-check{width:14px;height:14px;color:var(--green);flex-shrink:0}
.ri-prio{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:700;flex-shrink:0}
.ri-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri-project{font-size:11px;color:var(--blue);flex-shrink:0}
.ri-date{font-size:11px;color:var(--text-3);flex-shrink:0}
.reflection-card{margin-top:14px}
.reflection-textarea{width:100%;min-height:110px;padding:11px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;line-height:1.6;resize:vertical;background:#FFF}
.reflection-textarea:focus{outline:none;border-color:var(--ink-3)}
.reflection-hint{font-size:11px;color:var(--text-3);margin-top:5px}
.past-week{margin-top:10px}
.past-week-header{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;padding:8px 0;user-select:none}
.past-week-header svg{width:14px;height:14px;transition:transform .2s}
.past-week.open .past-week-header svg{transform:rotate(90deg)}
.past-week-body{display:none;font-size:13px;color:var(--text-2);white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:10px 12px;line-height:1.6}
.past-week.open .past-week-body{display:block}

/* ==================== Alert Banner ==================== */
.alert-section{padding:12px 20px 0}
.alert-banner{background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.alert-banner.has-alert{border-left:3px solid var(--red)}
.alert-banner.no-alert{border-left:3px solid var(--green)}
.alert-header{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;font-weight:600}
.alert-header svg{width:16px;height:16px}
.alert-header.has-alert{color:var(--red)}
.alert-header.no-alert{color:var(--green)}
.alert-body{padding:0 14px 10px}
.alert-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;background:var(--red-bg);margin-bottom:6px;flex-wrap:wrap}
.alert-item:last-child{margin-bottom:0}
.alert-item .alert-prio{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;flex-shrink:0}
.alert-item .alert-prio.P0{background:var(--red);color:#fff}
.alert-item .alert-prio.P1{background:var(--amber);color:#fff}
.alert-item .alert-prio.P2{background:var(--blue);color:#fff}
.alert-item .alert-title{font-size:13px;font-weight:500;flex:1;min-width:0}
.alert-item .alert-meta{font-size:11px;color:var(--text-3);flex-shrink:0}
.alert-item .alert-postpone{font-size:11px;color:var(--red);font-weight:500;flex-shrink:0}
.alert-ok-msg{font-size:13px;color:var(--green);font-weight:500}

/* ==================== Empty / Modal / Toast ==================== */
.empty-state{text-align:center;padding:44px 20px;color:var(--text-3)}
.empty-state svg{width:44px;height:44px;margin-bottom:10px;opacity:.35}
.empty-state p{font-size:13px}
.modal-overlay{position:fixed;inset:0;background:rgba(43,38,34,.4);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--card);border-radius:var(--radius-lg);padding:22px;max-width:400px;width:100%;box-shadow:var(--shadow-lg)}
.modal h3{font-size:16px;font-weight:700;margin-bottom:10px}
.modal p{font-size:13px;color:var(--text-2);margin-bottom:16px;line-height:1.6}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#FBF8F3;padding:9px 18px;border-radius:9px;font-size:13px;opacity:0;transition:all .25s;z-index:200;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red)}

/* ==================== Sync / Auth ==================== */
.sync-btn{position:relative}
.sync-dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:#C9C2B8;border:1.5px solid var(--card)}
.sync-dot.on{background:#5cba6d}
.sync-dot.err{background:#ff6b6d}
.login-modal .modal{max-width:360px;width:92%}
.login-field{margin-bottom:12px}
.login-field label{display:block;font-size:12px;color:var(--text-3);margin-bottom:4px}
.login-field input{width:100%;padding:10px 11px;border:1px solid var(--border);border-radius:var(--radius);font-size:16px;background:#FFF;color:var(--text);box-sizing:border-box}
.login-field input:focus{outline:none;border-color:var(--red)}
.login-error{color:var(--red);font-size:12px;min-height:16px;margin-bottom:8px}
.login-switch{font-size:12px;color:var(--text-3);text-align:center;margin-top:10px;cursor:pointer}
.login-switch:hover{color:var(--red)}
.sync-info{font-size:13px;color:var(--text-2);margin-bottom:14px;line-height:1.8}
.auth-wall{max-width:400px;margin:8vh auto 0;background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:30px 26px;text-align:center}
.auth-wall .aw-logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#8B1A1A,#5C2828);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#F5EBDD}
.auth-wall .aw-logo svg{width:28px;height:28px}
.auth-wall h2{font-family:var(--serif);font-size:22px;margin-bottom:4px}
.auth-wall .aw-sub{font-size:13px;color:var(--text-3);margin-bottom:20px}
.auth-wall form{text-align:left}

/* ==================== Responsive ==================== */
@media(max-width:768px){
  .sidebar{display:none}
  .mobile-nav{display:flex !important}
  .content{padding:14px 12px 84px}
  .header-bar{padding:8px 12px}
  .logo-area h1{font-size:16px}
  .logo-area .subtitle{display:none}
  .header-actions .btn-text{display:none}
  .header-actions .btn{padding:8px 10px;min-width:38px;justify-content:center}
  .ov-stats{grid-template-columns:repeat(2,1fr);gap:8px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .chart-row{grid-template-columns:1fr}
  .todo-form .form-row{flex-direction:column;align-items:stretch}
  .todo-form .form-group{width:100%}
  .todo-form .input,.todo-form .select{width:100%}
  .cal-cell{min-height:24px;padding:1px}
  .cal-date{font-size:10px}
  .alert-section{padding:10px 12px 0}
  .subtasks{margin-left:18px}
}

/* ===== v1 carried-over styles (missing classes) ===== */
.logo-area .avatar-logo{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #E5E3E0;flex-shrink:0;background:#fff}
/* ==================== Backup Reminder ==================== */
.backup-reminder{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:var(--radius);margin:12px 20px 0;font-size:13px;color:var(--amber)}
.backup-reminder svg{width:18px;height:18px;flex-shrink:0}
.backup-reminder .dismiss{margin-left:auto;color:var(--text-3);cursor:pointer;font-size:18px;padding:0 4px}
.todo-group-header .group-count{font-size:12px;color:var(--text-3);background:var(--bg);padding:1px 8px;border-radius:10px}
.badge.deadline{background:var(--bg);color:var(--text-2);border:1px solid var(--border)}
.badge.deadline.overdue{background:var(--red-bg);color:var(--red);border-color:var(--red-border)}
.badge.project{background:var(--ink);color:rgba(255,255,255,.8);border:1px solid var(--ink)}
.badge.postpone{background:var(--red);color:#fff}
.badge.monthly{background:#FFF3E0;color:#B45309;border:1px solid #FCD9A6}
.todo-edit-form .te-input{border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:14px;color:var(--text)}
.todo-edit-form .te-input:focus{outline:none;border-color:var(--red)}
.todo-edit-form .te-title{flex:1;min-width:140px}
.todo-edit-form .te-select{min-width:64px}
.todo-edit-form .te-date{min-width:130px}
.todo-edit-form .te-monthly{min-width:120px;max-width:200px}
.todo-edit-form .te-btns{display:flex;gap:6px;width:100%;margin-top:2px}
.todo-edit-form .te-remark{width:100%;min-height:50px;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--text);resize:vertical;font-family:inherit}
.todo-edit-form .te-remark:focus{outline:none;border-color:var(--red)}
.todo-note{font-size:12px;color:var(--text-3);margin-top:4px;padding:4px 8px;background:var(--bg);border-radius:4px;border-left:2px solid var(--border-l);line-height:1.5;word-break:break-all;white-space:pre-wrap}
.subtask-edit-form .se-remark{width:100%;min-height:40px;border:1px solid var(--border-l);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--text);resize:vertical;font-family:inherit}
.subtask-edit-form .se-remark:focus{outline:none;border-color:var(--red)}
.subtask-note{font-size:11px;color:var(--text-3);margin-top:3px;padding:3px 6px;background:var(--bg);border-radius:4px;border-left:2px solid var(--border-l);line-height:1.4;word-break:break-all;white-space:pre-wrap}
.project-progress-header{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2);margin-bottom:4px}
.progress-bar{width:100%;height:6px;background:var(--border-l);border-radius:3px;overflow:hidden}
.project-todos{margin-top:10px}
.project-todo{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.project-todo .mini-check{width:16px;height:16px;border:1.5px solid var(--border);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.project-todo.done .mini-check{background:var(--green);border-color:var(--green)}
.project-todo.done .mini-check svg{width:10px;height:10px;color:#fff}
.project-todo.done span{text-decoration:line-through;color:var(--text-3)}
.project-todo .pt-prio{font-size:10px;font-weight:700;padding:1px 4px;border-radius:3px}
.project-todo .pt-prio.P0{background:var(--red-bg);color:var(--red)}
.project-todo .pt-prio.P1{background:var(--amber-bg);color:var(--amber)}
.project-todo .pt-prio.P2{background:var(--blue-bg);color:var(--blue)}
.edit-input{width:100%;border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:14px;margin-bottom:8px}
.edit-input:focus{outline:none;border-color:var(--red)}
.stat-card .stat-value.red{color:var(--red)}
.bar-chart{width:100%}
.blocker-item .blocker-text{color:var(--text)}
/* ==================== Responsive ==================== */



/* ==================== Monthly Todo ==================== */
.monthly-group{margin-bottom:18px}
.monthly-group-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border-l)}
.monthly-group-header h3{font-size:13px;font-weight:600;color:var(--text-2)}
.monthly-group-header .group-count{font-size:12px;color:var(--text-3);background:var(--bg);padding:1px 8px;border-radius:10px}
.monthly-group-header.overdue h3{color:var(--red)}
.monthly-group-header.done h3{color:var(--text-3)}
/* Subtask styles */
.subtask-list{margin-left:20px;margin-top:6px;padding-left:10px;border-left:2px solid var(--border-l)}
.subtask-item .subtask-title{font-size:13px;color:var(--text-2);flex:1;line-height:1.5}
.subtask-item.done .subtask-title{text-decoration:line-through;color:var(--text-3)}
.subtask-item .subtask-meta{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:2px}
.subtask-item .subtask-del{background:none;border:none;color:var(--text-3);cursor:pointer;padding:2px;opacity:0;transition:opacity .15s;margin-left:auto;flex-shrink:0}
.subtask-item:hover .subtask-del{opacity:.6}
.subtask-item .subtask-del:hover{opacity:1;color:var(--red)}
.subtask-form{display:flex;flex-direction:column;gap:4px;margin-left:20px;margin-top:6px;padding-left:10px;border-left:2px solid var(--border-l)}
.subtask-form-main{display:flex;gap:6px}
.subtask-form-main input{flex:1;font-size:13px;border:1px solid var(--border-l);border-radius:6px;padding:4px 8px;min-width:0}
.subtask-form-main select{font-size:12px;border:1px solid var(--border-l);border-radius:6px;padding:4px 6px}
.subtask-form-main input[type=date]{width:auto}
.subtask-form-repeat{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.subtask-repeat-label{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-3);cursor:pointer;white-space:nowrap}
.subtask-repeat-label input{margin:0;cursor:pointer}
.subtask-repeat-range{display:none;gap:4px;align-items:center}
.subtask-repeat-range.show{display:inline-flex}
.subtask-repeat-range input{font-size:12px;border:1px solid var(--border-l);border-radius:6px;padding:4px 6px}
.subtask-repeat-range span{font-size:11px;color:var(--text-3)}
.subtask-add-btn{background:var(--ink);color:#fff;border:none;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.subtask-add-btn:hover{background:var(--red)}
.subtask-toggle{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--text-3);cursor:pointer;background:none;border:none;padding:2px 6px;border-radius:4px;transition:background .15s}
.subtask-toggle:hover{background:var(--bg)}
.subtask-toggle svg{width:12px;height:12px}
.subtask-count{font-size:10px;color:var(--text-3);background:var(--bg);padding:0 5px;border-radius:8px}
.subtask-edit-btn{background:none;border:none;color:var(--text-3);cursor:pointer;padding:2px;opacity:0;transition:opacity .15s;flex-shrink:0}
.subtask-item:hover .subtask-edit-btn{opacity:.6}
.subtask-edit-btn:hover{opacity:1;color:var(--red)}
.subtask-edit-btn svg{width:13px;height:13px}
.subtask-edit-form{display:none;flex:1;flex-wrap:wrap;gap:6px;align-items:center}
.subtask-item.editing .todo-check,.subtask-item.editing>div:not(.subtask-edit-form),.subtask-item.editing .subtask-del,.subtask-item.editing .subtask-edit-btn{display:none}
.subtask-item.editing .subtask-edit-form{display:flex}
.subtask-edit-form .se-input{border:1px solid var(--border-l);border-radius:6px;padding:4px 8px;font-size:13px;color:var(--text-2)}
.subtask-edit-form .se-input:focus{outline:none;border-color:var(--red)}
.subtask-edit-form .se-title{flex:1;min-width:120px}
.subtask-edit-form .se-select{min-width:56px}
.subtask-edit-form .se-date{width:auto;min-width:120px}
.subtask-edit-form .se-btns{display:flex;gap:6px;width:100%;margin-top:2px}
.badge.repeat{background:#f0e6f6;color:#7b3f9e;border:1px solid #d4b3e8}
.badge.repeat-todos{background:#e8f4fd;color:#2563a8;border:1px solid #b3d4f0;font-size:9px}
/* Project group header */
.monthly-group-header.project-header{border-bottom-color:var(--border);padding:8px 10px;background:var(--bg);border-radius:8px 8px 0 0;margin-bottom:6px}
.monthly-group-header.project-header h3{color:var(--ink);font-size:14px}
/* ==================== Project Progress Slider ==================== */
.proj-progress-section{margin:10px 0}
@media(max-width:768px){.backup-reminder{margin:10px 12px 0}}

/* ===== v6: goal & note editing ===== */
.goal-actions{display:flex;gap:6px;margin-top:8px;justify-content:center}
.goal-card .todo-edit-form{padding:10px 0 0}
.goal-card .todo-edit-form .ge-title{width:100%;margin-bottom:6px}
.goal-card .todo-edit-form .ge-metric{width:100%;margin-bottom:6px}
.goal-card .todo-edit-form .ge-target{width:100%;margin-bottom:6px}
.goal-card.editing .todo-edit-form{display:block}
.goal-card.editing .goal-ring,.goal-card.editing .goal-name,.goal-card.editing .goal-num,.goal-card.editing .goal-actions{display:none}
.note-card .note-edit-form{display:none;margin-top:8px}
.note-card.editing .note-edit-form{display:block}
.note-card.editing .note-content,.note-card.editing .note-footer{display:none}


/* ===== v6.2 layout fixes ===== */
.todo-item>.todo-edit-form{width:100%}
.todo-item.editing>.todo-check,.todo-item.editing>.todo-body,.todo-item.editing>.todo-actions{display:none}
.subtask-item .todo-check{width:16px;height:16px;margin-top:1px;flex-shrink:0}
.subtask-item .todo-check svg{width:11px;height:11px}
.subtask-item .badge{font-size:9px;padding:1px 5px}


/* ===== v6.3 overview monthly ===== */
.ovm-group-label{font-size:12px;color:var(--text-3);margin:12px 0 8px;font-weight:600}
.ovm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.ovm-card{background:var(--card);border:1px solid var(--border-l);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.ovm-card:hover{box-shadow:var(--shadow-lg);border-color:var(--border)}
.ovm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ovm-title{font-size:13.5px;font-weight:600;line-height:1.45}
.ovm-pct{font-family:var(--serif);font-size:20px;color:var(--red);flex-shrink:0;line-height:1}
.ovm-meta{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.ovm-bar{height:4px;background:var(--border-l);border-radius:2px;margin-top:9px;overflow:hidden}
.ovm-bar>div{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.ovm-detail{display:none;margin-top:10px;border-top:1px dashed var(--border-l);padding-top:8px}
.ovm-card.open .ovm-detail{display:block}
.ovm-sec{font-size:11px;font-weight:600;color:var(--text-3);margin:8px 0 3px}
.ovm-remark{font-size:12.5px;color:var(--text-2);line-height:1.6}
.ovm-none{font-size:12px;color:var(--text-3)}
.ovm-row{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;padding:2.5px 0;color:var(--text-2)}
.ovm-row.done{color:var(--text-3);text-decoration:line-through}
.ovm-dot{width:15px;height:15px;border-radius:50%;border:1.2px solid var(--ink-3);flex-shrink:0;font-size:10px;line-height:14px;text-align:center;color:#fff;margin-top:1px}
.ovm-row.done .ovm-dot{background:var(--green);border-color:var(--green)}
.ovm-row-title{flex:1;min-width:0;line-height:1.5}
.ovm-row-date{font-size:11px;color:var(--text-3);flex-shrink:0}
@media(max-width:768px){.ovm-grid{grid-template-columns:1fr}}

</style>
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header class="app-header">
  <div class="header-bar">
    <div class="logo-area">
      <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
      <h1>何老师工作台</h1>
      <span class="subtitle">清华同衡 · 个人办公</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline sync-btn" id="syncBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
        <span class="btn-text" id="syncBtnText">云同步</span>
        <span class="sync-dot" id="syncDot"></span>
      </button>
      <button class="btn btn-outline" id="exportBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="btn-text">导出备份</span>
      </button>
      <button class="btn btn-outline" id="importBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <span class="btn-text">导入</span>
      </button>
      <button class="btn btn-danger" id="clearBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        <span class="btn-text">清空</span>
      </button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  </div>
  <div class="cal-widget" id="calendarWidget"></div>
</header>

<!-- ==================== ERROR / CACHE BANNERS ==================== -->
<div class="error-banner" id="errorBanner" style="display:none">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <span class="eb-text" id="errorText"></span>
  <button class="btn btn-sm btn-red" id="errorRetry">重试</button>
</div>
<div class="cache-banner" id="cacheBanner" style="display:none">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;flex-shrink:0"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  <span>云端连接失败，当前显示本机缓存数据，恢复后将自动同步。</span>
</div>

<!-- ==================== ALERT BANNER ==================== -->
<div class="alert-section" id="alertSection">
  <div class="alert-banner" id="alertBanner"></div>
</div>

<!-- ==================== MAIN LAYOUT ==================== -->
<div class="main-layout">
  <aside class="sidebar">
    <div class="nav-section">
      <div class="nav-label">工作模块</div>
      <button class="nav-item active" data-tab="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
        <span>总体概览</span>
      </button>
      <button class="nav-item" data-tab="monthly">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/><circle cx="8" cy="15" r="1" fill="currentColor"/><circle cx="12" cy="15" r="1" fill="currentColor"/><circle cx="16" cy="15" r="1" fill="currentColor"/></svg>
        <span>月度任务</span>
        <span class="nav-count" id="navMonthlyCount">0</span>
      </button>
      <button class="nav-item" data-tab="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4h6v3H9z" fill="currentColor" stroke="none"/><path d="M9 12l2 2 4-4"/></svg>
        <span>今天待办</span>
        <span class="nav-count" id="navTodayCount">0</span>
      </button>
      <button class="nav-item" data-tab="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
        <span>灵感速记</span>
        <span class="nav-count" id="navNotesCount">0</span>
      </button>
      <button class="nav-item" data-tab="projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        <span>项目跟进</span>
        <span class="nav-count" id="navProjectsCount">0</span>
      </button>
      <button class="nav-item" data-tab="review">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
        <span>每周复盘</span>
      </button>
    </div>
    <div class="sidebar-footer">
      <p>数据实时保存至云端<br>换设备登录自动同步</p>
    </div>
  </aside>

  <main class="content">
    <!-- ===== Overview Tab ===== -->
    <div class="tab-content active" id="tab-overview">
      <div class="ov-greet" id="ovGreet"><div class="sk-row" style="height:34px;width:60%"></div></div>
      <div class="ov-stats stats-grid" id="ovStats">
        <div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div>
      </div>
      <div class="ov-section-title">月度任务</div>
      <div id="ovMonthly">
        <div class="sk-row"></div><div class="sk-row"></div>
      </div>
      <div class="ov-section-title">今日聚焦</div>
      <div class="today-zone" id="ovToday">
        <div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div>
      </div>
    </div>

    <!-- ===== Monthly Tab ===== -->
    <div class="tab-content" id="tab-monthly">
      <h2 class="tab-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/><circle cx="8" cy="15" r="1" fill="currentColor"/><circle cx="12" cy="15" r="1" fill="currentColor"/><circle cx="16" cy="15" r="1" fill="currentColor"/></svg>
        月度任务
      </h2>
      <p class="tab-sub">按自然月滚动，未完成任务自动顺延至本月</p>
      <div class="todo-form">
        <div class="form-row">
          <div class="form-group">
            <select class="select" id="monthlyTodoProject" style="min-width:180px">
              <option value="">无项目</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group input-flex">
            <input type="text" class="input" id="monthlyTodoTitle" placeholder="输入月度任务..." onkeydown="if(event.key==='Enter')addMonthlyTodo()">
          </div>
          <div class="form-group">
            <select class="select" id="monthlyTodoPriority">
              <option value="P0">P0 紧急</option>
              <option value="P1" selected>P1 重要</option>
              <option value="P2">P2 常规</option>
            </select>
          </div>
          <div class="form-group">
            <input type="date" class="input" id="monthlyTodoDeadline">
          </div>
          <button class="btn btn-primary" onclick="addMonthlyTodo()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            添加
          </button>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:1">
            <textarea class="input" id="monthlyTodoRemark" placeholder="备注：详细说明任务内容..." rows="2" style="font-size:13px;resize:vertical"></textarea>
          </div>
        </div>
      </div>
      <div class="group-toggle">
        <button id="grpBtnDate" class="active" onclick="setMonthlyGroupMode('date')">按日期分组</button>
        <button id="grpBtnProject" onclick="setMonthlyGroupMode('project')">按项目分组</button>
      </div>
      <div id="monthlyTodoList"><div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div></div>
    </div>

    <!-- ===== Today Tab ===== -->
    <div class="tab-content" id="tab-today">
      <h2 class="tab-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4h6v3H9z" fill="currentColor" stroke="none"/><path d="M9 12l2 2 4-4"/></svg>
        今天待办
      </h2>
      <p class="tab-sub">重复子任务每日自动生成，可关联月度任务与项目</p>
      <div class="todo-form">
        <div class="form-row">
          <div class="form-group input-flex">
            <input type="text" class="input" id="todoTitle" placeholder="输入任务标题..." onkeydown="if(event.key==='Enter')addTodo()">
          </div>
          <div class="form-group">
            <select class="select" id="todoPriority">
              <option value="P0">P0 紧急</option>
              <option value="P1" selected>P1 重要</option>
              <option value="P2">P2 常规</option>
            </select>
          </div>
          <div class="form-group">
            <input type="date" class="input" id="todoDeadline">
          </div>
          <div class="form-group">
            <select class="select" id="todoMonthlyTask" onchange="onTodoMonthlySelect()">
              <option value="">关联月度任务</option>
            </select>
          </div>
          <div class="form-group" id="todoSubtaskWrap" style="display:none">
            <select class="select" id="todoSubtask" onchange="onTodoSubtaskSelect()">
              <option value="">关联子任务</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="addTodo()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            添加
          </button>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:1">
            <textarea class="input" id="todoRemark" placeholder="备注：详细说明任务内容..." rows="2" style="font-size:13px;resize:vertical"></textarea>
          </div>
        </div>
        <div id="todoProjectHint" class="project-hint" style="display:none"></div>
      </div>
      <div class="group-toggle">
        <button id="todoGrpBtnDeadline" class="active" onclick="setTodoGroupMode('deadline')">按截止日期</button>
        <button id="todoGrpBtnPriority" onclick="setTodoGroupMode('priority')">按轻重缓急</button>
      </div>
      <div id="deadlineReminder"></div>
      <div id="todoList"><div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div></div>
    </div>

    <!-- ===== Notes Tab ===== -->
    <div class="tab-content" id="tab-notes">
      <h2 class="tab-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
        灵感速记
      </h2>
      <p class="tab-sub">随手记下想法、灵感与碎片信息，支持标签筛选</p>
      <div class="notes-form">
        <textarea class="input" id="noteContent" placeholder="随手记下想法、灵感、碎片信息..." rows="3"></textarea>
        <div class="form-row" style="margin-top:8px">
          <div class="form-group input-flex">
            <input type="text" class="input" id="noteTags" placeholder="标签，逗号分隔（如：滨水区,慢行系统）" onkeydown="if(event.key==='Enter')addNote()">
          </div>
          <button class="btn btn-primary" onclick="addNote()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            记录
          </button>
        </div>
      </div>
      <div class="tag-filter" id="tagFilter"></div>
      <div id="notesList"><div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div></div>
    </div>

    <!-- ===== Projects Tab ===== -->
    <div class="tab-content" id="tab-projects">
      <h2 class="tab-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        项目跟进
      </h2>
      <p class="tab-sub">三阶段推进（前期 33% / 中期 66% / 完成 100%），含质量管控清单</p>
      <div class="project-form">
        <div class="form-row">
          <div class="form-group input-flex">
            <input type="text" class="input" id="projName" placeholder="项目名称" onkeydown="if(event.key==='Enter')addProject()">
          </div>
          <div class="form-group">
            <select class="select" id="projStatus">
              <option value="P0">P0 紧急</option>
              <option value="P1" selected>P1 重要</option>
              <option value="P2">P2 常规</option>
            </select>
          </div>
        </div>
        <div class="form-row" style="margin-top:8px">
          <div class="form-group input-flex">
            <input type="text" class="input" id="projCurrent" placeholder="当前阶段">
          </div>
          <div class="form-group input-flex">
            <input type="text" class="input" id="projNext" placeholder="下一步">
          </div>
        </div>
        <div class="form-row" style="margin-top:8px">
          <div class="form-group input-flex">
            <input type="text" class="input" id="projBlocker" placeholder="卡点（没有则留空）">
          </div>
          <button class="btn btn-primary" onclick="addProject()">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            添加项目
          </button>
        </div>
      </div>
      <div id="projectsList"><div class="sk-row"></div><div class="sk-row"></div></div>
    </div>

    <!-- ===== Review Tab ===== -->
    <div class="tab-content" id="tab-review">
      <h2 class="tab-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>
        每周复盘
      </h2>
      <p class="tab-sub">滚动统计最近 7 天数据，复盘内容按 ISO 周保存</p>
      <div id="reviewContent"><div class="sk-row"></div><div class="sk-row"></div><div class="sk-row"></div></div>
    </div>
  </main>
</div>

<!-- ==================== MOBILE NAV ==================== -->
<nav class="mobile-nav">
  <button class="nav-item active" data-tab="overview">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    <span>概览</span>
  </button>
  <button class="nav-item" data-tab="monthly">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
    <span>月度</span>
  </button>
  <button class="nav-item" data-tab="today">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4h6v3H9z" fill="currentColor" stroke="none"/><path d="M9 12l2 2 4-4"/></svg>
    <span>待办</span>
  </button>
  <button class="nav-item" data-tab="notes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
    <span>速记</span>
  </button>

/* fetch with one auto-refresh-retry on 401 */
async function apiFetch(url,opts,retried){
  opts=opts||{};
  opts.headers=Object.assign(baseHeaders(),opts.headers||{});
  var r=await fetch(url,opts);
  if(r.status===401&&!retried){
    await authRefresh();
    return apiFetch(url,opts,true);
  }
  if(!r.ok){
    var t=await r.text().catch(function(){return''});
    var msg=t;
    try{msg=JSON.parse(t).message||t}catch(e){}
    throw new Error(msg||('请求失败('+r.status+')'));
  }
  if(r.status===204)return null;
  var ct=r.headers.get('content-type')||'';
  return ct.indexOf('json')>=0?r.json():null;
}

/* ==================== ISO week ==================== */
function isoWeekKey(d){
  d=d||new Date();
  var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  var day=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-day);
  var yearStart=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  var week=Math.ceil((((t-yearStart)/86400000)+1)/7);
  return t.getUTCFullYear()+'-W'+String(week).padStart(2,'0');
}

/* ==================== DB executor + pending queue ==================== */
var pendingOps=load(KEYS.pending,[]);
function savePending(){save(KEYS.pending,pendingOps)}

function execOp(op){
  var url,h;
  if(op.op==='insert'){
    return apiFetch(REST+'/'+op.table,{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(op.rows)});
  }
  if(op.op==='update'){
    return apiFetch(REST+'/'+op.table+'?'+op.filter,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify(op.patch)});
  }
  if(op.op==='delete'){
    return apiFetch(REST+'/'+op.table+'?'+op.filter,{method:'DELETE'});
  }
  if(op.op==='upsert'){
    return apiFetch(REST+'/'+op.table,{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(op.rows)});
  }
  return Promise.resolve();
}

var flushing=false;
async function dbExec(op){
  /* fire-and-forget with queue-on-failure; UI already updated optimistically */
  try{
    await execOp(op);
    setSyncState('on');
    flushPending();
  }catch(e){
    console.warn('dbExec failed, queued:',op,e);
    pendingOps.push(op);savePending();
    setSyncState('error');
    showError('数据写入云端失败：'+errMsg(e)+'。操作已保存在本机队列，网络恢复后点「重试」同步。',flushPendingManual);
  }
}
function errMsg(e){
  var m=(e&&e.message)||'网络异常';
  if(m.indexOf('Failed to fetch')>=0||m.indexOf('NetworkError')>=0)return '无法连接云端，请检查网络';
  return m.length>80?m.substr(0,80)+'…':m;
}
async function flushPending(){
  if(flushing||pendingOps.length===0)return;
  flushing=true;
  try{
    while(pendingOps.length>0){
      await execOp(pendingOps[0]);
      pendingOps.shift();savePending();
    }
    setSyncState('on');
    hideError();
    showCacheBanner(false);
  }catch(e){
    setSyncState('error');
  }
  flushing=false;
}
function flushPendingManual(){
  showError('正在重试同步…',null);

/* ==================== Fetch all tables ==================== */
async function fetchAllTables(){
  var sel='?select=*';
  var results=await Promise.all([
    apiFetch(REST+'/mt_todos'+sel),
    apiFetch(REST+'/mt_monthly'+sel),
    apiFetch(REST+'/mt_subtasks'+sel),
    apiFetch(REST+'/mt_notes'+sel),
    apiFetch(REST+'/mt_projects'+sel),
    apiFetch(REST+'/ov_goals'+sel),
    apiFetch(REST+'/mt_reflections'+sel)
  ]);
  var todos=(results[0]||[]).map(todoFromDb);
  var monthly=(results[1]||[]).map(monthlyFromDb);
  var subs=(results[2]||[]).map(subFromDb);
  var notes=(results[3]||[]).map(noteFromDb);
  var projects=(results[4]||[]).map(projFromDb);
  var goals=(results[5]||[]).map(goalFromDb);
  var refs=results[6]||[];
  /* nest subtasks into monthly */
  var byParent={};
  subs.forEach(function(s,idx){
    var pid=results[2][idx].monthly_id;
    if(!byParent[pid])byParent[pid]=[];
    byParent[pid].push(s);
  });
  monthly.forEach(function(m){m.subtasks=byParent[m.id]||[];});
  /* reflections: current week -> string, others -> past list */
  var curWeek=isoWeekKey();
  var reflections='',past=[];
  refs.forEach(function(r){
    if(r.week_key===curWeek){reflections=r.content||'';}
    else{past.push({weekKey:r.week_key,content:r.content||'',updatedAt:msOrNull(r.updated_at)||0});}
  });
  past.sort(function(a,b){return a.weekKey<b.weekKey?1:-1});
  return{todos:todos,monthlyTodos:monthly,notes:notes,projects:projects,goals:goals,reflections:reflections,pastReflections:past};
}

/* ==================== One-time migration from old kv_store ==================== */
async function migrateFromKvStore(){
  if(load(KEYS.migrated,false))return false;
  var rows;
  try{
    rows=await apiFetch(REST+'/kv_store?select=key,value');
  }catch(e){
    save(KEYS.migrated,true); /* kv_store不存在等情况：跳过 */
    return false;
  }
  if(!rows||rows.length===0){save(KEYS.migrated,true);return false;}
  var blobs={};
  rows.forEach(function(r){blobs[r.key]=r.value;});
  var any=false;
  try{
    if(blobs.todos&&blobs.todos.length){await execOp({op:'insert',table:'mt_todos',rows:blobs.todos.map(todoToDb)});any=true;}
    if(blobs.monthlyTodos&&blobs.monthlyTodos.length){
      await execOp({op:'insert',table:'mt_monthly',rows:blobs.monthlyTodos.map(monthlyToDb)});
      var subRows=[];
      blobs.monthlyTodos.forEach(function(mt){(mt.subtasks||[]).forEach(function(s){subRows.push(subToDb(s,mt.id));});});
      if(subRows.length)await execOp({op:'insert',table:'mt_subtasks',rows:subRows});
      any=true;
    }
    if(blobs.notes&&blobs.notes.length){await execOp({op:'insert',table:'mt_notes',rows:blobs.notes.map(noteToDb)});any=true;}
    if(blobs.projects&&blobs.projects.length){await execOp({op:'insert',table:'mt_projects',rows:blobs.projects.map(projToDb)});any=true;}
    if(blobs.reflections){
      await execOp({op:'upsert',table:'mt_reflections',rows:[{id:session.userId+'_'+isoWeekKey(),user_id:session.userId,week_key:isoWeekKey(),content:blobs.reflections,updated_at:new Date().toISOString()}]});
      any=true;
    }
  }catch(e){
    console.warn('migration partial failure',e);
    showError('历史数据迁移未完全成功：'+errMsg(e)+'，点击重试。',function(){migrateFromKvStore().then(function(){location.reload();});});
    return any;
  }
  save(KEYS.migrated,true);
  return any;
}

/* ==================== Auto rollover (overdue -> today / next month) ==================== */
function autoRollover(){
  var today=todayStr();
  state.todos.forEach(function(t){
    if(!t.done&&t.deadline&&t.deadline<today){
      if(!t.originalDeadline)t.originalDeadline=t.deadline;
      t.deadline=today;
      t.postponeCount=(t.postponeCount||0)+1;
      dbExec({op:'update',table:'mt_todos',filter:'id=eq.'+t.id,patch:{deadline:t.deadline,original_deadline:t.originalDeadline,postpone_count:t.postponeCount,updated_at:new Date().toISOString()}});
    }
  });
}
function autoRolloverMonthly(){
  var curMonth=currentMonthKey();
  state.monthlyTodos.forEach(function(t){
    if(!t.done&&t.deadline&&monthKey(t.deadline)<curMonth){
      if(!t.originalDeadline)t.originalDeadline=t.deadline;
      t.deadline=endOfMonth();
      t.postponeCount=(t.postponeCount||0)+1;
      dbExec({op:'update',table:'mt_monthly',filter:'id=eq.'+t.id,patch:{deadline:t.deadline,original_deadline:t.originalDeadline,postpone_count:t.postponeCount,updated_at:new Date().toISOString()}});
    }
  });
}

function getDateRange(start,end){
var dates=[];
if(!start||!end)return dates;
var d=new Date(start+'T00:00:00');
var endD=new Date(end+'T00:00:00');
if(d>endD)return dates;
while(d<=endD){
var y=d.getFullYear();
var m=String(d.getMonth()+1).padStart(2,'0');
var day=String(d.getDate()).padStart(2,'0');
dates.push(y+'-'+m+'-'+day);
d.setDate(d.getDate()+1);
}
return dates;
}

function getMonthlyTodoGroups(){
var curMonth=currentMonthKey();
var nxtMonth=nextMonthKey();
var groups={
overdue:{title:'\u903E\u671F\u5DF2\u987A\u5EF6',items:[],cls:'overdue'},
thismonth:{title:'\u672C\u6708\uFF08'+monthLabel(curMonth)+'\uFF09',items:[],cls:''},
nextmonth:{title:'\u4E0B\u6708\uFF08'+monthLabel(nxtMonth)+'\uFF09',items:[],cls:''},
later:{title:'\u66F4\u8FDC',items:[],cls:''},
done:{title:'\u5DF2\u5B8C\u6210',items:[],cls:'done'}
};
state.monthlyTodos.forEach(function(t){
if(t.done){groups.done.items.push(t);return}
var mk=monthKey(t.deadline);
if(t.postponeCount>0&&mk===curMonth){groups.overdue.items.push(t);return}
if(mk<curMonth){groups.overdue.items.push(t);return}
if(mk===curMonth){groups.thismonth.items.push(t);return}
if(mk===nxtMonth){groups.nextmonth.items.push(t);return}
groups.later.items.push(t);
});
var prio={P0:0,P1:1,P2:2};
Object.keys(groups).forEach(function(k){
groups[k].items.sort(function(a,b){return(a.deadline||'')<(b.deadline||'')?-1:1});
});
groups.done.items.sort(function(a,b){return(b.doneAt||0)-(a.doneAt||0)});
return groups;
}

function getMonthlyTodoGroupsByProject(){
var groups={};
var noProject={title:'\u65E0\u9879\u76EE',items:[],cls:'',isNoProject:true};
state.monthlyTodos.forEach(function(t){
if(t.done)return;
if(t.projectId){
var proj=state.projects.find(function(p){return p.id===t.projectId});
var key=t.projectId;
if(!groups[key]){
groups[key]={title:proj?proj.name:'\u672A\u77E5\u9879\u76EE',items:[],cls:'',isProject:true,projectId:key};
}
groups[key].items.push(t);
}else{
noProject.items.push(t);
}
});
/* done group */
var doneItems=state.monthlyTodos.filter(function(t){return t.done});
var prio={P0:0,P1:1,P2:2};
Object.keys(groups).forEach(function(k){
groups[k].items.sort(function(a,b){return(a.deadline||'')<(b.deadline||'')?-1:1});
});
noProject.items.sort(function(a,b){return(a.deadline||'')<(b.deadline||'')?-1:1});
doneItems.sort(function(a,b){return(b.doneAt||0)-(a.doneAt||0)});
/* build ordered array */
var result=[];
Object.keys(groups).forEach(function(k){result.push(groups[k])});
if(noProject.items.length>0)result.push(noProject);
if(doneItems.length>0)result.push({title:'\u5DF2\u5B8C\u6210',items:doneItems,cls:'done'});
return result;
}

/* ==================== Deadline Reminder ==================== */

function getDaysRemaining(deadline){
if(!deadline)return null;
var today=new Date(todayStr()+'T00:00:00');
var dl=new Date(deadline+'T00:00:00');
var diff=Math.round((dl-today)/86400000);
return diff;
}

function renderDeadlineReminder(){
var el=document.getElementById('deadlineReminder');
if(!el)return;
var reminders=[];
var maxDays=7;
state.monthlyTodos.filter(function(m){return!m.done}).forEach(function(mt){
var subs=(mt.subtasks||[]).filter(function(s){return!s.done});
if(subs.length>0){
/* has subtasks - check each non-repeat subtask */
subs.forEach(function(s){
if(s.isRepeat)return;
var hasTodo=state.todos.some(function(t){return t.subtaskId===s.id});
if(hasTodo)return;
var days=getDaysRemaining(s.deadline);
if(days===null||days>maxDays)return;
reminders.push({type:'subtask',mtId:mt.id,subId:s.id,title:s.title,parentTitle:mt.title,deadline:s.deadline,days:days,priority:s.priority,projectId:mt.projectId});
});
}else{
/* no subtasks - check the monthly task itself */
var hasTodo=state.todos.some(function(t){return t.monthlyTodoId===mt.id});
if(hasTodo)return;
var days=getDaysRemaining(mt.deadline);
if(days===null||days>maxDays)return;
reminders.push({type:'monthly',mtId:mt.id,title:mt.title,deadline:mt.deadline,days:days,priority:mt.priority,projectId:mt.projectId});
}
});
if(reminders.length===0){el.innerHTML='';return;}
reminders.sort(function(a,b){return a.days-b.days});
var html='<div class="deadline-reminder">';
html+='<div class="deadline-reminder-header"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>\u672A\u5173\u8054\u5F85\u529E\u7684\u5373\u5C06\u622A\u6B62\u4EFB\u52A1</div>';

function generateSuggestions(){
var suggestions=[];
var blocked=state.projects.filter(function(p){return p.blocker&&p.blocker.trim()});
blocked.forEach(function(p){
suggestions.push(p.name+'\u5361\u5728\u300C'+p.blocker+'\u300D\uFF0C\u5EFA\u8BAE\u4F18\u5148\u534F\u8C03\u89E3\u51B3');
});
state.projects.forEach(function(p){
if((p.progress||0)>60&&(!p.qualityChecks||p.qualityChecks.length===0)){
suggestions.push(p.name+'\u8FDB\u5EA6\u5DF2\u8FBE'+(p.progress||0)+'%\uFF0C\u5EFA\u8BAE\u542F\u52A8\u9662\u5185\u5BA1\u67E5');
}
});
state.projects.forEach(function(p){
var linked=state.todos.filter(function(t){return t.projectId===p.id}).length+state.monthlyTodos.filter(function(t){return t.projectId===p.id}).length;
if(linked===0&&(p.progress||0)<100){
suggestions.push(p.name+'\u6682\u65E0\u5173\u8054\u5F85\u529E\uFF0C\u5EFA\u8BAE\u62C6\u89E3\u4E3A\u5177\u4F53\u4EFB\u52A1');
}
});
var p0Undone=state.todos.filter(function(t){return!t.done&&t.priority==='P0'}).length;
if(p0Undone>0){
suggestions.push('\u6709 '+p0Undone+' \u4E2AP0\u7D27\u6025\u5F85\u529E\u672A\u5B8C\u6210\uFF0C\u5EFA\u8BAE\u4F18\u5148\u5904\u7406');
}
var monthlyOverdue=state.monthlyTodos.filter(function(t){return!t.done&&t.postponeCount>0}).length;
if(monthlyOverdue>0){
suggestions.push('\u6709 '+monthlyOverdue+' \u4E2A\u6708\u5EA6\u4EFB\u52A1\u5DF2\u903E\u671F\u987A\u5EF6\uFF0C\u5EFA\u8BAE\u5173\u6CE8\u63A8\u8FDB');
}
if(suggestions.length===0){
suggestions.push('\u5404\u9879\u63A8\u8FDB\u987A\u5229\uFF0C\u4FDD\u6301\u8282\u594F');
}
return suggestions;
}

function renderReview(){
var now=Date.now();
var weekAgo=now-7*86400000;
var completed=state.todos.filter(function(t){return t.done&&t.doneAt&&t.doneAt>=weekAgo}).concat(state.monthlyTodos.filter(function(t){return t.done&&t.doneAt&&t.doneAt>=weekAgo}));
var totalActive=state.todos.filter(function(t){return!t.done||(t.doneAt&&t.doneAt>=weekAgo)||(!t.doneAt&&t.createdAt>=weekAgo)}).length+state.monthlyTodos.filter(function(t){return!t.done||(t.doneAt&&t.doneAt>=weekAgo)||(!t.doneAt&&t.createdAt>=weekAgo)}).length;
var completionRate=totalActive>0?Math.round(completed.length/totalActive*100):0;
var prioStats={P0:0,P1:0,P2:0};
completed.forEach(function(t){prioStats[t.priority]=(prioStats[t.priority]||0)+1});
var projEnergy={};
completed.forEach(function(t){
var pid=t.projectId||'_indep';
if(!projEnergy[pid])projEnergy[pid]={completed:0,total:0,name:t.projectId?'':'\u72EC\u7ACB\u4EFB\u52A1'};
projEnergy[pid].completed++;
});
state.todos.concat(state.monthlyTodos).forEach(function(t){
var pid=t.projectId||'_indep';
if(projEnergy[pid]){
projEnergy[pid].total++;
if(!t.projectId)projEnergy[pid].name='\u72EC\u7ACB\u4EFB\u52A1';
}
});
state.projects.forEach(function(p){
if(projEnergy[p.id])projEnergy[p.id].name=p.name;
});
var projArr=Object.keys(projEnergy).map(function(k){return projEnergy[k]}).filter(function(x){return x.completed>0}).sort(function(a,b){return b.completed-a.completed});
var blockers=state.projects.filter(function(p){return p.blocker&&p.blocker.trim()});
var html='';
html+='<div class="stats-grid">';
html+='<div class="stat-card"><div class="stat-value">'+completed.length+'</div><div class="stat-label">\u672C\u5468\u5B8C\u6210\uFF08\u4EF6\uFF09</div></div>';
html+='<div class="stat-card"><div class="stat-value blue">'+completionRate+'%</div><div class="stat-label">\u5B8C\u6210\u7387</div></div>';
html+='<div class="stat-card"><div class="stat-value amber">'+state.projects.length+'</div><div class="stat-label">\u6D3B\u8DC3\u9879\u76EE</div></div>';
html+='<div class="stat-card"><div class="stat-value red">'+blockers.length+'</div><div class="stat-label">\u5F53\u524D\u5361\u70B9</div></div>';
html+='</div>';

/* Optimization suggestions */
var suggestions=generateSuggestions();
html+='<div class="suggestion-card">';

function getTodoStatsForDate(dateStr){
var todos=state.todos.filter(function(t){return t.deadline===dateStr});
var total=todos.length;
var done=todos.filter(function(t){return t.done}).length;
return{total:total,done:done,undone:total-done};
}

html+='<button class="cal-today-btn" onclick="calNav(0)">\u4ECA\u6708</button>';
html+='<button onclick="calNav(1)" title="\u4E0B\u4E2A\u6708"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px"><polyline points="9 18 15 12 9 6"/></svg></button>';

var todayStats={total:0,done:0,undone:0};
var totalMonthTodos=0,totalMonthDone=0;

}

var body=document.getElementById('calBody');

}

function toggleCalendar(){
var body=document.getElementById('calBody');
var btn=document.getElementById('calToggleBtn');
if(!body)return;
var isCollapsed=body.classList.toggle('collapsed');
if(btn)btn.classList.toggle('collapsed',isCollapsed);
save(KEYS.calCollapsed,isCollapsed);
}

function calNav(dir){
var today=new Date();
var viewDate=state.calViewDate?new Date(state.calViewDate):new Date(today.getFullYear(),today.getMonth(),1);
if(dir===0){
viewDate=new Date(today.getFullYear(),today.getMonth(),1);
}else{
viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+dir,1);
}
state.calViewDate=viewDate.getFullYear()+'-'+String(viewDate.getMonth()+1).padStart(2,'0')+'-01';
renderCalendar();
}
