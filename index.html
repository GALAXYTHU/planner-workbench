/* ==================== Mutations: Todos ==================== */
function addTodo(){
  var title=document.getElementById('todoTitle').value.trim();
  if(!title)return;
  var priority=document.getElementById('todoPriority').value;
  var deadline=document.getElementById('todoDeadline').value||todayStr();
  var monthlyTodoId=document.getElementById('todoMonthlyTask').value||null;
  var subtaskId=null;
  var subtaskWrap=document.getElementById('todoSubtaskWrap');
  if(subtaskWrap&&subtaskWrap.style.display!=='none'){subtaskId=document.getElementById('todoSubtask').value||null;}
  var projectId=null;
  if(monthlyTodoId){
    var mt=state.monthlyTodos.find(function(x){return x.id===monthlyTodoId});
    if(mt){projectId=mt.projectId||null;priority=mt.priority;}
  }
  var remark=document.getElementById('todoRemark').value.trim();
  var t={id:uid(),title:title,priority:priority,deadline:deadline,done:false,projectId:projectId,monthlyTodoId:monthlyTodoId,subtaskId:subtaskId,remark:remark,createdAt:Date.now(),doneAt:null,postponeCount:0,originalDeadline:null};
  state.todos.push(t);
  dbExec({op:'insert',table:'mt_todos',rows:[todoToDb(t)]});
  document.getElementById('todoTitle').value='';
  document.getElementById('todoRemark').value='';
  document.getElementById('todoMonthlyTask').value='';
  onTodoMonthlySelect();
  var hint=document.getElementById('todoProjectHint');if(hint)hint.style.display='none';
  refreshAll();
  showToast('已添加任务');
}
function toggleTodo(id){
  var t=state.todos.find(function(x){return x.id===id});
  if(!t)return;
  t.done=!t.done;
  t.doneAt=t.done?Date.now():null;
  dbExec({op:'update',table:'mt_todos',filter:'id=eq.'+id,patch:{done:t.done,done_at:isoOrNull(t.doneAt),updated_at:new Date().toISOString()}});
  refreshAll();
}
function deleteTodo(id){
  state.todos=state.todos.filter(function(x){return x.id!==id});
  dbExec({op:'delete',table:'mt_todos',filter:'id=eq.'+id});
  refreshAll();
}
function saveTodoEdit(id){
  var t=state.todos.find(function(x){return x.id===id});
  if(!t)return;
  var item=document.querySelector('[data-todo-id="'+id+'"]');
  if(!item)return;
  var newTitle=item.querySelector('.te-title').value.trim();
  if(!newTitle){showToast('标题不能为空');return;}
  t.title=newTitle;
  t.priority=item.querySelector('.te-select').value;
  var newDate=item.querySelector('.te-date').value;
  if(newDate)t.deadline=newDate;
  var newMtId=item.querySelector('.te-monthly').value||null;
  t.monthlyTodoId=newMtId;
  var subSel=item.querySelector('.te-subtask');
  t.subtaskId=(subSel&&newMtId)?(subSel.value||null):null;
  var remarkEl=item.querySelector('.te-remark');
  if(remarkEl)t.remark=remarkEl.value.trim();
  if(newMtId){
    var mt=state.monthlyTodos.find(function(m){return m.id===newMtId});
    if(mt){t.projectId=mt.projectId||null;t.priority=mt.priority;}
  }else{
    t.projectId=null;
  }
  dbExec({op:'update',table:'mt_todos',filter:'id=eq.'+id,patch:{title:t.title,priority:t.priority,deadline:dateOrNull(t.deadline),remark:t.remark,project_id:t.projectId,monthly_todo_id:t.monthlyTodoId,subtask_id:t.subtaskId,updated_at:new Date().toISOString()}});
  refreshAll();
  showToast('已保存修改');
}
function postponeTodo(id){
  var t=state.todos.find(function(x){return x.id===id});
  if(!t)return;
  if(!t.originalDeadline)t.originalDeadline=t.deadline;
  t.deadline=dateOffset(1);
  t.postponeCount=(t.postponeCount||0)+1;
  dbExec({op:'update',table:'mt_todos',filter:'id=eq.'+id,patch:{deadline:t.deadline,original_deadline:t.originalDeadline,postpone_count:t.postponeCount,updated_at:new Date().toISOString()}});
  refreshAll();
  showToast('已顺延到明天');
}
function quickAddTodo(mtId,subId){
  var mt=state.monthlyTodos.find(function(x){return x.id===mtId});
  if(!mt)return;
  var title=mt.title,priority=mt.priority,deadline=mt.deadline||todayStr(),projectId=mt.projectId||null;
  if(subId){
    var st=(mt.subtasks||[]).find(function(s){return s.id===subId});
    if(st){title=st.title;priority=st.priority;if(st.deadline)deadline=st.deadline;}
  }
  var t={id:uid(),title:title,priority:priority,deadline:deadline,done:false,projectId:projectId,monthlyTodoId:mtId,subtaskId:subId||null,createdAt:Date.now(),doneAt:null,postponeCount:0,originalDeadline:null};
  state.todos.push(t);
  dbExec({op:'insert',table:'mt_todos',rows:[todoToDb(t)]});
  refreshAll();
  showToast('已新建待办');
}

/* ==================== Mutations: Subtasks ==================== */
function addSubtask(parentId){
  var input=document.getElementById('subtaskInput_'+parentId);
  if(!input)return;
  var title=input.value.trim();
  if(!title)return;
  var prSel=document.getElementById('subtaskPriority_'+parentId);
  var dlInput=document.getElementById('subtaskDeadline_'+parentId);
  var priority=prSel?prSel.value:'P1';
  var deadline=dlInput?dlInput.value:'';
  var remarkInput=document.getElementById('subtaskRemark_'+parentId);
  var remark=remarkInput?remarkInput.value.trim():'';
  var mt=state.monthlyTodos.find(function(x){return x.id===parentId});
  if(!mt)return;
  if(!mt.subtasks)mt.subtasks=[];
  var repCb=document.getElementById('subtaskRepeat_'+parentId);
  var isRepeat=repCb?repCb.checked:false;
  var repStart='',repEnd='';
  if(isRepeat){
    repStart=document.getElementById('subtaskRepeatStart_'+parentId).value;
    repEnd=document.getElementById('subtaskRepeatEnd_'+parentId).value;
    if(!repStart||!repEnd){showToast('请选择重复日期区间');return;}
    if(repStart>repEnd){showToast('开始日期不能晚于结束日期');return;}
    deadline=repEnd;
  }
  var subId=uid();
  var subtaskObj={id:subId,title:title,priority:priority,deadline:deadline,done:false,remark:remark,createdAt:Date.now()};
  if(isRepeat){subtaskObj.isRepeat=true;subtaskObj.repeatStart=repStart;subtaskObj.repeatEnd=repEnd;}
  mt.subtasks.push(subtaskObj);
  mt.subtasks.sort(function(a,b){return(a.deadline||'')<(b.deadline||'')?-1:1});
  dbExec({op:'insert',table:'mt_subtasks',rows:[subToDb(subtaskObj,parentId)]});
  if(isRepeat){
    var dates=getDateRange(repStart,repEnd);
    var newTodos=[];
    dates.forEach(function(d){
      var t={id:uid(),title:title,priority:priority,deadline:d,done:false,projectId:mt.projectId||null,monthlyTodoId:parentId,subtaskId:subId,isAutoGenerated:true,createdAt:Date.now(),doneAt:null,postponeCount:0,originalDeadline:null};
      state.todos.push(t);
      newTodos.push(todoToDb(t));
    });
    if(newTodos.length)dbExec({op:'insert',table:'mt_todos',rows:newTodos});
    showToast('已添加重复子任务，生成'+dates.length+'条今日待办');
  }else{
    showToast('已添加子任务');
  }
  input.value='';
  if(dlInput)dlInput.value='';
  if(remarkInput)remarkInput.value='';
  if(repCb)repCb.checked=false;
  var repRange=document.getElementById('subtaskRepeatRange_'+parentId);
  if(repRange)repRange.classList.remove('show');
  var repStartEl=document.getElementById('subtaskRepeatStart_'+parentId);
  var repEndEl=document.getElementById('subtaskRepeatEnd_'+parentId);
  if(repStartEl)repStartEl.value='';
  if(repEndEl)repEndEl.value='';
  input.focus();
  refreshAll();
}

/* ==================== Overview (总体概览) ==================== */
var GOAL_METRICS={todos_done:'完成待办',monthly_done:'完成月度任务',projects_done:'完成项目'};
function goalProgress(g){
  if(g.metric==='todos_done'){
    return state.todos.filter(function(t){return t.done&&t.doneAt&&monthKey(dateStrOf(t.doneAt))===g.period}).length;
  }
  if(g.metric==='monthly_done'){
    return state.monthlyTodos.filter(function(t){return t.done&&t.doneAt&&monthKey(dateStrOf(t.doneAt))===g.period}).length;
  }
  if(g.metric==='projects_done'){
    return state.projects.filter(function(p){return(p.progress||0)>=100}).length;
  }
  return 0;
}
function dateStrOf(ms){var d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function monthlyProgress(m){
  var subs=m.subtasks||[];
  if(subs.length>0){return Math.round(subs.filter(function(s){return s.done}).length/subs.length*100);}
  var linked=state.todos.filter(function(t){return t.monthlyTodoId===m.id});
  if(linked.length>0){return Math.round(linked.filter(function(t){return t.done}).length/linked.length*100);}
  return 0;
}
function renderOvMonthly(){
  var el=document.getElementById('ovMonthly');
  var act=state.monthlyTodos.filter(function(m){return!m.done}).sort(function(a,b){return(a.deadline||'9999')<(b.deadline||'9999')?-1:1});
  if(act.length===0){el.innerHTML='<div class="tz-empty">本月没有进行中的月度任务。</div>';return;}
  function card(m){
    var proj=m.projectId?state.projects.find(function(p){return p.id===m.projectId}):null;
    var pct=monthlyProgress(m);
    var subs=(m.subtasks||[]).slice().sort(function(a,b){return(a.deadline||'')<(b.deadline||'')?-1:1});
    var subsDone=subs.filter(function(s){return s.done}).length;
    var today=todayStr();
    var todayTodos=state.todos.filter(function(x){return x.monthlyTodoId===m.id&&x.deadline===today});
    var h='';
    h+='<div class="ovm-card" data-action="ovm-toggle">';
    h+='<div class="ovm-top"><div class="ovm-title">'+escapeHtml(m.title)+'</div><div class="ovm-pct">'+pct+'%</div></div>';
    h+='<div class="ovm-meta">';
    h+='<span class="badge '+m.priority+'">'+m.priority+'</span>';
    if(m.deadline)h+='<span class="badge deadline">'+fmtDate(m.deadline)+'</span>';
    if(proj)h+='<span class="badge project">'+escapeHtml(proj.name)+'</span>';
    if(subs.length>0)h+='<span class="badge monthly">子任务 '+subsDone+'/'+subs.length+'</span>';
    h+='</div>';
    h+='<div class="ovm-bar"><div style="width:'+Math.max(pct,pct>0?4:0)+'%"></div></div>';
    h+='<div class="ovm-detail">';
    h+='<div class="ovm-sec">任务描述</div>';
    h+='<div class="ovm-remark">'+escapeHtml(m.remark||'（无备注）')+'</div>';
    h+='<div class="ovm-sec">子任务（'+subs.length+'）</div>';
    if(subs.length===0)h+='<div class="ovm-none">暂无子任务</div>';
    subs.forEach(function(s){
      h+='<div class="ovm-row'+(s.done?' done':'')+'"><span class="ovm-dot">'+(s.done?'✓':'')+'</span><span class="ovm-row-title">'+escapeHtml(s.title)+'</span>'+(s.deadline?'<span class="ovm-row-date">'+fmtDateShort(s.deadline)+'</span>':'')+'</div>';
    });
    h+='<div class="ovm-sec">今天待办（'+todayTodos.length+'）</div>';
    if(todayTodos.length===0)h+='<div class="ovm-none">今天没有关联待办</div>';
    todayTodos.forEach(function(x){
      h+='<div class="ovm-row'+(x.done?' done':'')+'"><span class="ovm-dot">'+(x.done?'✓':'')+'</span><span class="ovm-row-title">'+escapeHtml(x.title)+'</span></div>';
    });
    h+='</div></div>';
    return h;
  }
  var withProj=act.filter(function(m){return m.projectId});
  var noProj=act.filter(function(m){return!m.projectId});
  var html='';
  if(withProj.length>0)html+='<div class="ovm-group-label">有项目 · '+withProj.length+'</div><div class="ovm-grid">'+withProj.map(card).join('')+'</div>';
  if(noProj.length>0)html+='<div class="ovm-group-label">无项目 · '+noProj.length+'</div><div class="ovm-grid">'+noProj.map(card).join('')+'</div>';
  el.innerHTML=html;
}
function renderOverview(){
  /* greeting */
  var h=new Date().getHours();
  var greet=h<6?'夜深了':(h<12?'早上好':(h<18?'下午好':'晚上好'));
  var wd=['日','一','二','三','四','五','六'][new Date().getDay()];
  var today=todayStr();
  var undoneToday=state.todos.filter(function(t){return!t.done&&t.deadline===today}).length;
  document.getElementById('ovGreet').innerHTML='<h2>'+greet+'</h2><p>'+fmtDate(today)+' · 周'+wd+(undoneToday>0?' · 今天还有 '+undoneToday+' 项待办':' · 今天的待办都完成了')+'</p>';

  /* stats */
  var weekAgo=dateOffset(-6);
  var doneThisWeek=state.todos.filter(function(t){return t.done&&t.doneAt&&dateStrOf(t.doneAt)>=weekAgo}).length;
  var monthlyActive=state.monthlyTodos.filter(function(t){return!t.done}).length;
  var projActive=state.projects.filter(function(p){return(p.progress||0)<100}).length;
  var todayTotal=state.todos.filter(function(t){return t.deadline===today}).length;
  var todayDone=state.todos.filter(function(t){return t.deadline===today&&t.done}).length;
  document.getElementById('ovStats').innerHTML=
    '<div class="stat-card"><div class="stat-value">'+(todayTotal-todayDone)+'<span style="font-size:13px;color:var(--text-3)">/'+todayTotal+'</span></div><div class="stat-label">今日待办</div></div>'+
    '<div class="stat-card"><div class="stat-value">'+doneThisWeek+'</div><div class="stat-label">近7天完成</div></div>'+
    '<div class="stat-card"><div class="stat-value">'+monthlyActive+'</div><div class="stat-label">月度任务进行中</div></div>'+
    '<div class="stat-card"><div class="stat-value">'+projActive+'</div><div class="stat-label">进行中项目</div></div>';
  renderOvMonthly();

  /* today zone */
  var tz=state.todos.filter(function(t){return!t.done&&t.deadline&&t.deadline<=today})
    .sort(function(a,b){var p={P0:0,P1:1,P2:2};return(p[a.priority]||1)-(p[b.priority]||1)});
  var tzHtml='';
  if(tz.length===0){
    tzHtml='<div class="tz-empty">今天没有紧急待办，可以从容推进月度任务。</div>';
  }else{
    tz.slice(0,5).forEach(function(t){
      var proj=t.projectId?state.projects.find(function(p){return p.id===t.projectId}):null;
      tzHtml+='<div class="tz-item">';
      tzHtml+='<button class="tz-check" data-action="toggle-todo" data-id="'+t.id+'" title="完成"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>';
      tzHtml+='<span class="tz-title">'+escapeHtml(t.title)+'</span>';
      tzHtml+='<span class="tz-tag badge '+t.priority+'">'+t.priority+'</span>';
      if(proj)tzHtml+='<span class="tz-tag">'+escapeHtml(proj.name)+'</span>';
      tzHtml+='<span class="tz-date'+(t.deadline<today?' overdue':'')+'">'+(t.deadline<today?'逾期':'今天')+'</span>';
      tzHtml+='</div>';
    });
    if(tz.length>5)tzHtml+='<div class="tz-empty" style="padding:6px 0 0">还有 '+(tz.length-5)+' 项，<a href="javascript:void(0)" data-action="goto-today" style="color:var(--red)">去「今天待办」查看全部 →</a></div>';
  }
  /* suggestions */
  var sug=generateSuggestions();
  if(sug.length>0){
    tzHtml+='<div class="suggestion-card" style="margin-top:10px">';
    sug.slice(0,2).forEach(function(s){
      tzHtml+='<div class="suggestion-item"><span class="sug-dot"></span>'+escapeHtml(s)+'</div>';
    });
    tzHtml+='</div>';
  }
  document.getElementById('ovToday').innerHTML=tzHtml;

}

/* ==================== Export / Import / Clear ==================== */
function exportData(){
  var data={version:3,exportDate:new Date().toISOString(),todos:state.todos,monthlyTodos:state.monthlyTodos,notes:state.notes,projects:state.projects,goals:state.goals,reflections:state.reflections,pastReflections:state.pastReflections};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='规划师工作台备份_'+todayStr()+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出备份文件');
}
async function wipeAllTables(){
  var tables=['mt_todos','mt_subtasks','mt_monthly','mt_notes','mt_projects','ov_goals','mt_reflections'];
  for(var i=0;i<tables.length;i++){
    await execOp({op:'delete',table:tables[i],filter:'user_id=eq.'+session.userId});
  }
}
function importData(file){
  var reader=new FileReader();
  reader.onload=function(e){
    var data;
    try{
      data=JSON.parse(e.target.result);
      if(!data.todos&&!data.monthlyTodos&&!data.notes&&!data.projects)throw new Error('format');
    }catch(err){showToast('导入失败：文件格式不正确');return;}
    showConfirm('导入备份','导入将【覆盖】当前云端的全部数据，确定继续吗？',async function(){
      try{
        setSyncState('syncing');
        await wipeAllTables();
        if(data.todos&&data.todos.length)await execOp({op:'insert',table:'mt_todos',rows:data.todos.map(todoToDb)});
        if(data.monthlyTodos&&data.monthlyTodos.length){
          await execOp({op:'insert',table:'mt_monthly',rows:data.monthlyTodos.map(monthlyToDb)});
          var subRows=[];
          data.monthlyTodos.forEach(function(mt){(mt.subtasks||[]).forEach(function(s){subRows.push(subToDb(s,mt.id));});});
          if(subRows.length)await execOp({op:'insert',table:'mt_subtasks',rows:subRows});
        }
        if(data.notes&&data.notes.length)await execOp({op:'insert',table:'mt_notes',rows:data.notes.map(noteToDb)});
        if(data.projects&&data.projects.length)await execOp({op:'insert',table:'mt_projects',rows:data.projects.map(projToDb)});
        if(data.goals&&data.goals.length)await execOp({op:'insert',table:'ov_goals',rows:data.goals.map(goalToDb)});
        var wk=isoWeekKey();
        if(data.reflections)await execOp({op:'upsert',table:'mt_reflections',rows:[{id:session.userId+'_'+wk,user_id:session.userId,week_key:wk,content:data.reflections,updated_at:new Date().toISOString()}]});
        if(data.pastReflections&&data.pastReflections.length){
          await execOp({op:'upsert',table:'mt_reflections',rows:data.pastReflections.map(function(r){return{id:session.userId+'_'+r.weekKey,user_id:session.userId,week_key:r.weekKey,content:r.content||'',updated_at:new Date().toISOString()};})});
        }
        var fresh=await fetchAllTables();
        applyData(fresh);
        autoRollover();autoRolloverMonthly();
        setSyncState('on');
        refreshAll();
        showToast('导入成功');
      }catch(err2){
        setSyncState('error');
        showError('导入写入云端失败：'+errMsg(err2)+'，点击重试。',function(){importData(file)});
      }
    });
  };
  reader.readAsText(file);
}
function clearAllData(){
  showConfirm('清空所有数据','确定要清空云端的所有数据吗？此操作不可撤销。',async function(){
    try{
      setSyncState('syncing');
      await wipeAllTables();
      state.todos=[];state.monthlyTodos=[];state.notes=[];state.projects=[];state.goals=[];state.reflections='';state.pastReflections=[];
      setSyncState('on');
      refreshAll();
      showToast('已清空全部数据');
    }catch(e){
      setSyncState('error');
      showError('清空失败：'+errMsg(e)+'，点击重试。',clearAllData);
    }
  });
}

/* ==================== Sync modal ==================== */
function openSyncModal(){
  var info=document.getElementById('syncInfo');
  var cache=load(KEYS.cache,null);
  var lines='';
  lines+='<p><strong>账号：</strong>'+escapeHtml(session?session.email:'-')+'</p>';
  lines+='<p><strong>云端状态：</strong>已连接，数据实时保存</p>';
  lines+='<p><strong>待同步操作：</strong>'+pendingOps.length+' 条</p>';
  if(cache&&cache.ts)lines+='<p><strong>本机缓存：</strong>'+relativeTime(cache.ts)+'更新</p>';
  info.innerHTML=lines;
  document.getElementById('loginOverlay').style.display='flex';
}
function closeSyncModal(){document.getElementById('loginOverlay').style.display='none'}
async function syncNow(){
  closeSyncModal();
  setSyncState('syncing');
  await flushPending();
  try{
    var fresh=await fetchAllTables();
    applyData(fresh);
    setSyncState('on');hideError();showCacheBanner(false);
    refreshAll();
    showToast('同步完成');
  }catch(e){
    setSyncState('error');
    showError('同步失败：'+errMsg(e)+'，点击重试。',syncNow);
  }
}


/* ==================== Bind events ==================== */
function bindEvents(){
  document.querySelectorAll('[data-tab]').forEach(function(el){
    el.addEventListener('click',function(){switchTab(el.dataset.tab)});
  });
  document.getElementById('exportBtn').addEventListener('click',exportData);
  document.getElementById('importBtn').addEventListener('click',function(){document.getElementById('importFile').click()});
  document.getElementById('importFile').addEventListener('change',function(e){
    if(e.target.files[0])importData(e.target.files[0]);
    e.target.value='';
  });
  document.getElementById('clearBtn').addEventListener('click',clearAllData);
  document.getElementById('syncBtn').addEventListener('click',openSyncModal);
  document.getElementById('syncPanelClose').addEventListener('click',closeSyncModal);
  document.getElementById('syncNowBtn').addEventListener('click',syncNow);
  document.getElementById('loginOverlay').addEventListener('click',function(e){if(e.target===this)closeSyncModal();});
  document.getElementById('errorRetry').addEventListener('click',function(){if(errorRetryFn)errorRetryFn();});
  document.getElementById('modalCancel').addEventListener('click',closeModal);
  document.getElementById('modalConfirm').addEventListener('click',function(){if(modalCallback)modalCallback();closeModal();});
  document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
  document.getElementById('tagFilter').addEventListener('click',function(e){
    var chip=e.target.closest('.tag-chip');
    if(!chip)return;
    state.noteFilter=chip.dataset.tag||null;
    renderNotes();
  });
  /* progress slider */
  document.addEventListener('input',function(e){
    if(e.target.classList.contains('phase-slider')){
      var card=e.target.closest('.project-card');
      if(card){
        var val=parseInt(e.target.value);
        var fill=card.querySelector('.phase-fill');
        var handle=card.querySelector('.phase-handle');
        var pct=card.querySelector('.proj-progress-label .pct');
        if(fill)fill.style.width=val+'%';
        if(handle)handle.style.left=val+'%';
        if(pct)pct.textContent=val+'%';
        var labels=card.querySelectorAll('.phase-label');
        labels.forEach(function(l,i){l.classList.toggle('active',i===getActivePhase(val));});
      }
    }
  });
  document.addEventListener('change',function(e){
    if(e.target.classList.contains('phase-slider')){
      updateProjectProgress(e.target.dataset.id,parseInt(e.target.value));
    }
  });
  /* global click delegation */
  document.addEventListener('click',function(e){
    var btn=e.target.closest('[data-action]');
    if(!btn)return;
    var action=btn.dataset.action;
    var id=btn.dataset.id;
    switch(action){
      case'toggle-todo':toggleTodo(id);break;
      case'toggle-monthly':toggleMonthlyTodo(id);break;
      case'postpone-todo':postponeTodo(id);break;
      case'postpone-monthly':postponeMonthlyTodo(id);break;
      case'delete-todo':deleteTodo(id);break;
      case'edit-todo':toggleTodoEdit(id);break;
      case'save-todo':saveTodoEdit(id);break;
      case'cancel-edit-todo':toggleTodoEdit(id);break;
      case'delete-monthly':deleteMonthlyTodo(id);break;
      case'edit-monthly':toggleMonthlyEdit(id);break;
      case'save-monthly':saveMonthlyEdit(id);break;
      case'cancel-edit-monthly':toggleMonthlyEdit(id);break;
      case'toggle-subtask-form':
        var sf=document.getElementById('subtaskForm_'+id);
        if(sf){sf.style.display=sf.style.display==='none'?'flex':'none';if(sf.style.display==='flex')document.getElementById('subtaskInput_'+id).focus();}
        break;
      case'toggle-subtask':toggleSubtask(id,btn.dataset.subid);break;
      case'delete-subtask':deleteSubtask(id,btn.dataset.subid);break;
      case'edit-subtask':toggleSubtaskEdit(id,btn.dataset.subid);break;
      case'save-subtask':saveSubtaskEdit(id,btn.dataset.subid);break;
      case'cancel-edit-subtask':toggleSubtaskEdit(id,btn.dataset.subid);break;
      case'edit-note':toggleNoteEdit(id);break;
      case'save-note':saveNoteEdit(id);break;
      case'cancel-note':toggleNoteEdit(id);break;
      case'delete-note':deleteNote(id);break;
      case'toggle-quality':toggleQualityCheck(id,btn.dataset.check,btn);break;
      case'delete-project':
        showConfirm('删除项目','删除后，关联的待办将变为无关联（不会删除）。确定吗？',function(){deleteProject(id)});
        break;
      case'edit-project':toggleProjectEdit(id);break;
      case'save-project':saveProjectEdit(id);break;
      case'cancel-edit-project':toggleProjectEdit(id);break;
      case'goto-projects':switchTab('projects');break;
      case'goto-today':switchTab('today');break;
      case'ovm-toggle':var oc=btn.closest('.ovm-card');if(oc)oc.classList.toggle('open');break;
      case'quick-add-todo':quickAddTodo(btn.dataset.mtid,btn.dataset.subid);break;
      case'add-goal':addGoal();break;
      case'edit-goal':toggleGoalEdit(id);break;
      case'save-goal':saveGoalEdit(id);break;
      case'cancel-goal':toggleGoalEdit(id);break;
      case'delete-goal':
        showConfirm('删除目标','确定删除这个目标吗？',function(){deleteGoal(id)});
        break;
      case'delete-reflection':deleteReflection(id);break;
    }
  });
}

/* ==================== Data load & boot ==================== */
function isEmptyData(d){
  return(!d.todos||d.todos.length===0)&&(!d.monthlyTodos||d.monthlyTodos.length===0)&&(!d.notes||d.notes.length===0)&&(!d.projects||d.projects.length===0)&&(!d.goals||d.goals.length===0)&&!d.reflections;
}
async function loadDataWithFallback(){
  setSyncState('syncing');
  try{
    if(session.expires_at&&Date.now()>session.expires_at)await authRefresh();
    var migrated=await migrateFromKvStore();
    var data=await fetchAllTables();
    if(!migrated&&isEmptyData(data)){
      var preset=getPresetData();
      if(preset&&(preset.todos||preset.monthlyTodos||preset.notes||preset.projects)){
        try{
          await seedFromData(preset);
          data=await fetchAllTables();
          showToast('已导入历史数据');
        }catch(seedErr){console.warn('seed failed',seedErr);}
      }
    }
    applyData(data);
    autoRollover();autoRolloverMonthly();
    hideError();showCacheBanner(false);setSyncState('on');
    refreshAll();
    flushPending();
  }catch(e){
    console.warn('fetch failed',e);
    setSyncState('error');
    var cache=loadCache();
    if(cache){
      applyData(cache);
      refreshAll();
      showCacheBanner(true);
      showError('无法从云端读取数据：'+errMsg(e)+'。当前显示本机缓存，点击重试。',function(){loadDataWithFallback()});
    }else{
      showError('无法从云端读取数据：'+errMsg(e)+'。请检查网络后点击重试。',function(){loadDataWithFallback()});
    }
  }
  var td=document.getElementById('todoDeadline');
  if(td&&!td.value)td.value=todayStr();
  var mtd=document.getElementById('monthlyTodoDeadline');
  if(mtd&&!mtd.value)mtd.value=endOfMonth();
  switchTab(load(KEYS.tab,'overview'));
}
async function boot(){
  bindEvents();
  session=load(KEYS.session,null);
  if(session&&session.email!==AUTO_EMAIL){session=null;try{localStorage.removeItem(KEYS.session)}catch(e){}}
  if(!session){
    try{await silentAuth();}
    catch(e){
      showError('自动连接云端失败：'+errMsg(e)+'。请检查网络后点击重试。',function(){boot()});
      return;
    }
  }
  await loadDataWithFallback();
}
boot();
</script>
